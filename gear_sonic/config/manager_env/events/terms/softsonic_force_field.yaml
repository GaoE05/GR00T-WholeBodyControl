# =============================================================================
# SoftSONIC：按增强数据里的力场参数施加外力
# =============================================================================
#
# 与 push_robot（给基座加随机速度冲量做鲁棒性训练）完全不同：这里模拟的是一个
# 弹簧式力场，F = k_ff · (设定点 - 手的实际位置)。机器人退让则力减小、硬扛则力
# 增大 —— 这个物理反馈是"柔顺降低交互力"能被度量的前提。
#
# interval_range_s 必须等于环境的控制步长（SONIC 是 50Hz -> 0.02s），
# is_global_time=true 使其每步触发一次并把 env_ids 传 None。
# 时序说明见 mdp/events.py:apply_softsonic_force_field 的文档字符串。
#
# =============================================================================

softsonic_force_field:
  _target_: isaaclab.managers.EventTermCfg
  func: gear_sonic.envs.manager_env.mdp:apply_softsonic_force_field
  mode: "interval"
  interval_range_s: [0.02, 0.02]
  is_global_time: true
  params:
    command_name: "motion"
    # 与 CMA 的 IK_CHECK_MAX_FORCE_MAGNITUDE / MAX_TORQUE_MAGNITUDE 一致
    max_force: 140.0
    max_torque: 10.0
    # 非零则每 N 步打印期望力 vs 实际力，用于确认物理反馈生效
    debug_print_every_n_steps: 0
