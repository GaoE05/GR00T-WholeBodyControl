# =============================================================================
# SoftSONIC：从增强数据回放外力
# =============================================================================
#
# 与 push_robot（给基座加速度冲量做鲁棒性训练）完全不同：这里施加的是**数据里
# 记录的那个特定力剖面**，因为柔顺监督目标 q_aug 就是针对它离线解出来的。
#
# interval_range_s 必须等于环境的控制步长（SONIC 是 50Hz -> 0.02s），
# is_global_time=True 使其每步触发一次并把 env_ids 传 None。
# 时序说明见 mdp/events.py:replay_softsonic_external_wrench 的文档字符串。
#
# =============================================================================

softsonic_replay_wrench:
  _target_: isaaclab.managers.EventTermCfg
  func: gear_sonic.envs.manager_env.mdp:replay_softsonic_external_wrench
  mode: "interval"
  interval_range_s: [0.02, 0.02]
  is_global_time: true
  params:
    command_name: "motion"
    # ‖F‖ 低于此值视为无外力。不能用 force_body_id 判断 —— 它含尚未开始的排队事件。
    force_threshold: 1.0
    # 非零则每 N 步打印施力统计，用于确认外力真的进了仿真。首次跑训练建议打开。
    debug_print_every_n_steps: 0
