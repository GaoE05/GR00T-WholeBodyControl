# 柔顺任务的终止组：项与 func 同 tracking/softsonic，**只放宽阈值**。
#
# 为什么必须放宽 —— 这不是调参，是逻辑必需：
#
# 终止项比较的是"机器人 vs 柔顺目标 q_aug"。而机器人在学会柔顺之前待在 q_ref
# （冻结 ATM 带它去的地方），所以它的"误差"至少是 |q_aug − q_ref| 本身。
# 实测该偏移（受力帧）：
#     连杆高度  k45 max 0.186 m（3.2% 帧 > 0.15）  k450 max 0.212 m（8.8% 帧 > 0.15）
#     骨盆高度  k45 max 0.176 m（0.7% 帧 > 0.15）  k450 max 0.212 m（2.8% 帧 > 0.15）
# 即：**用原生的 0.15 阈值，机器人会因为"还没柔顺"而被终止**，根本没有机会学。
# 实测后果：Mean length 从 clean_v1 的 ~3200 掉到 367~640。
#
# 本文件（_big）用于**柔顺幅度更大**的数据集（如 d1545，退让区间 U[0.15,0.45]）。
# 实测该数据集的柔顺需求（机器人待在 q_ref 时相对 q_aug 的偏差）：
#   连杆 |Δ高度|  p90 0.191 m  max 0.359 m   -> 0.30 阈值有 1.2% 的帧越界
#   骨盆 |Δ高度|  p90 0.152 m  max 0.234 m
# 沿用 0.30 的后果实测很严重：**78.8% 的 episode 被 ee_body_pos 终止**，
# time_out 只剩 14.6%，Mean length 从 3000+ 掉到 200~500 —— 机器人又一次是
# "因为还没柔顺"而被杀掉，统计量严重有偏。
#
# 阈值 = 实测最大柔顺需求 + SONIC 自身跟踪误差余量：
#   ee_body_pos  0.359 + 余量 -> 0.50
#   anchor_pos   0.234 + 余量 -> 0.40
# **换柔顺幅度更大的数据集时必须重新核这一条**，这是本项目重复踩过两次的坑。
# 注：这也解释了早期实验里"ee_body_pos 0.15→0.30 是单项最大增益"的原因 ——
# 当时是经验性发现，但 anchor_pos 一直留在 0.15 没改，本文件一并修正。
# foot_pos_xyz 不动：它比较的是脚踝，而脚踝在柔顺增强里基本不动。

defaults:
  - terms/anchor_pos_adaptive@_here_
  - terms/anchor_ori_full@_here_
  - terms/ee_body_pos_adaptive@_here_
  - terms/motion_time_out@_here_
  - terms/foot_pos_xyz@_here_

_target_: gear_sonic.envs.manager_env.mdp.terminations.TerminationsCfg

anchor_pos:
  func: gear_sonic.envs.manager_env.mdp:exceeded_compliant_anchor_height
  params:
    threshold: 0.40
anchor_ori_full:
  func: gear_sonic.envs.manager_env.mdp:exceeded_compliant_anchor_ori
  params:
    threshold: 0.2
ee_body_pos:
  func: gear_sonic.envs.manager_env.mdp:exceeded_compliant_body_height
  params:
    threshold: 0.50
foot_pos_xyz:
  params:
    threshold: 0.2
