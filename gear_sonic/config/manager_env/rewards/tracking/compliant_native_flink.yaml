# = compliant_native（原生 12 项，7 个跟踪项指向 q_aug）
#   + SoftMimic 力控实验专有的 4 项。
#
# ── 为什么必须加这 4 项（定量依据，不是"照抄上游"）────────────────────────
# 实测：机器人从"完全刚性停在 q_ref"走到"完全柔顺到达 q_aug"，
#
#     只用原生 12 项            奖励增益 0.1985   占正权重 8.0 的 2.48%
#     + force_link(σ0.1,w3.0)   奖励增益 1.2231   占正权重 11.0 的 11.12%
#     + force_cmd(σ20,w2.0)     奖励增益 1.6706   占正权重 13.0 的 12.85%
#
# 而 PPO 的 reward 逐迭代波动实测是 ±12%。也就是说**只用原生 12 项时，柔顺的
# 全部学习信号（2.48%）被自身噪声淹没了一个数量级** —— 策略随机游走是理性的，
# 因为往哪走奖励都差不多。这解释了 clean_v2 的全部现象：reward 平、‖Δz‖ 无界
# 增长、augJ 随 ‖Δz‖ 变差、以及把真实外力喂给 actor 也毫无改变（force-oracle
# 诊断 o1：f/i 1.036 vs 对照 1.030，augJ 0.063 vs 0.065，无差别）。
#
# 根因在 σ：原生主力项 tracking_relative_body_pos 的 σ=0.3 m，而柔顺位移只有
# 5~25 cm，exp(-(0.05/0.3)^2)=0.97，对柔顺几乎无感。而 force_link 的 σ=0.1 m
# **只盯受力连杆那一个点**，正好落在灵敏区间 —— 上游设计这一项就是为了这个。
#
# 注：v20 曾有这 4 项却未突破，但那时带着终止 bug（anchor_pos=0.15 会在柔顺
# 幅度最大的帧上误杀），而那恰是 force_link 梯度最强的样本。地基修好后重试。
#
# 权重与 σ 全取上游 g1_force_control.py:191-209 的原值。

# 注：这里**重复列出** compliant_native 的全部项而不是 include 它 —— hydra 的
# 嵌套 include 会把 defaults 的相对路径基准改成被包含方所在目录，
# `terms/...` 会被错解析。compliant_native.yaml 若有增减，这里要同步。

defaults:
  - terms/tracking_anchor_pos@_here_
  - terms/tracking_anchor_ori@_here_
  - terms/tracking_relative_body_pos@_here_
  - terms/tracking_relative_body_ori@_here_
  - terms/tracking_body_linvel@_here_
  - terms/tracking_body_angvel@_here_
  - terms/action_rate_l2@_here_
  - terms/joint_limit@_here_
  - terms/undesired_contacts@_here_
  - terms/anti_shake_ang_vel@_here_
  - terms/tracking_vr_5point_local@_here_
  - terms/feet_acc@_here_
  # ── SoftMimic 力控实验专有的 4 项 ──
  - terms/compliant_force_link_pos@_here_
  - terms/compliant_force_link_ori@_here_
  - terms/applied_force_tracking@_here_
  - terms/applied_torque_tracking@_here_

_target_: gear_sonic.envs.manager_env.mdp.rewards.RewardsCfg

tracking_anchor_pos:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_anchor_pos_error
tracking_anchor_ori:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_anchor_ori_error
tracking_relative_body_pos:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_relative_body_pos_error
tracking_relative_body_ori:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_relative_body_ori_error
tracking_vr_5point_local:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_local_vr_5point_error
tracking_body_linvel:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_body_linvel_error
tracking_body_angvel:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_body_angvel_error
feet_acc:
  weight: -2.5e-06
