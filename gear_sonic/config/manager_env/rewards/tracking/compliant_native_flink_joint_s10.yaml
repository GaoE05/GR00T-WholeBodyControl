# = compliant_native（原生 12 项，7 个跟踪项指向 q_aug）
#   + SoftMimic 力控实验专有的 5 项（含关节空间项）。
#
# ── B2 后重新核算（2026-09-22）───────────────────────────────────────────
# 旧的 2.48% / 11.12% / 12.85% 数据来自 B2 修复之前；当时 q_ref anchor 重复计入
# root compliance。B2(107313a) 明确要求重新比较，因此旧数据已作废，不能再作为
# “必须加 4 项”的依据。
#
# 在 runtime 2d1126a、full_original_b_v2、50 Hz 重采样的全部 27225 个有力帧上，
# 将机器人分别放到 q_ref/q_aug 后直接计算 reward，B2 后结果为：
#
#     只用原生 12 项              增益 3.1606 / 正权重 7  = 45.15%
#     + force_link 位置/朝向       增益 6.6956 / 正权重 13 = 51.50%
#     + force/torque command       增益 8.7866 / 正权重 17 = 51.69%
#     + compliant_joint（实际全配方）增益 10.2859 / 正权重 19 = 54.14%
#
# 结论：原生项已经有显著静态柔顺信号；SoftMimic 项仍有边际贡献，但不再是“否则
# 信号被噪声淹没”的必要条件。这里与 PPO ±12% 的比值只用于复现旧口径，不是统计
# 信噪比或可学习性的证明。完整证据见 notes/reward-recipe-b2-reaudit-20260922.md。
# 当前数值暂保留以维持既有实验配方；后续删项/调 σ 必须走单变量实验。

# 注：这里**重复列出** compliant_native 的全部项而不是 include 它 —— hydra 的
# 嵌套 include 会把 defaults 的相对路径基准改成被包含方所在目录，
# `terms/...` 会被错解析。compliant_native.yaml 若有增减，这里要同步。

# ── 关节空间项 tracking_compliant_joint_pos 的语义核验 ──────────────────
# 该函数/候选权重来自上游源码 joint_deviation_upper_body_commanded：w=2.0，核
# exp(-‖Δq‖/σ²)，σ=1.0，分子是一次范数而非平方，全 29 关节。但发布版
# StaticStand 的 resolved env.yaml 将该项设为 null；所以 w=2.0 不是发布模型依据。
# 我们的数据：‖q_aug-q_ref‖(29关节 L2) 有力帧中位 0.767 rad、p90 1.819。
#   停在 q_ref 时该项 = exp(-0.767) = 0.465，到达 q_aug = 1.0
#   => 可贡献增益 2.0*(1-0.465) = 1.071，与 force_link 的 1.02 相当
# σ=1.0 对 0.767 rad 落在有效分辨区间内，但 B2 后它与笛卡尔位置组的逐帧相关
# 达 0.878，存在重复加权；新配方建议优先删除，当前仅为兼容在跑实验而保留。


# ── σ 按我们自己的偏差量级重设（s10）─────────────────────────────────────
# 依据：奖励核 exp(-e²/σ²) 的有效分辨区间约 e ∈ [0.2σ, 1.5σ]。实测柔顺造成的偏差：
#   相对 anchor 的连杆位置  中位 0.0074 m  p90 0.0571 m
#   anchor 高度            中位 0.0069 m  p90 0.0349 m
#   连杆朝向               中位 0.0326 rad p90 0.2900 rad
# 而 SONIC 原生 σ 是 0.3 m / 0.4 rad —— 那是为"跟踪误差 0~30 cm"定的，用来分辨
# 5 cm 量级的柔顺位移必然失灵：exp(-(0.0074/0.3)²)=0.999，该项对柔顺完全迟钝。
#
# 实测"刚性->柔顺"的位置类奖励增益随 σ 的变化（占该三项总权重 3.5 的比例）：
#   σ=(0.30,0.30,0.10) 现状  5.9%
#   σ=(0.10,0.10,0.06)      11.6%
#   σ=(0.06,0.06,0.04)      17.0%
#   σ=(0.04,0.04,0.03)      21.8%
# 不取更小的值：SONIC 的基线跟踪误差约 3~5 cm，σ=0.04 时即使完全柔顺该项也只有
# exp(-1)=0.37，等于把策略控制不了的噪声也变成惩罚，会增大方差。
#
# 注意：这**不是偏离 SoftMimic**。上游的 σ 同样是按它自己的偏差量级定的
# （force_link σ=0.1 m 对应其 5 cm 量级的腕部位移），照抄数值而不照抄"σ 必须匹配
# 待分辨偏差量级"这条原则，才是没学到。
defaults:
  - terms/tracking_anchor_pos@_here_
  - terms/tracking_anchor_ori@_here_
  - terms/tracking_relative_body_pos@_here_
  - terms/tracking_relative_body_ori@_here_
  - terms/tracking_body_linvel@_here_
  - terms/tracking_body_angvel@_here_
  - terms/action_rate_l2@_here_
  - terms/latent_residual_l2_pure_zero@_here_
  - terms/joint_limit@_here_
  - terms/undesired_contacts@_here_
  - terms/anti_shake_ang_vel@_here_
  - terms/tracking_vr_5point_local@_here_
  - terms/feet_acc@_here_
  # ── SoftMimic 力控实验专有的 4 项 ──
  - terms/compliant_force_link_pos@_here_
  - terms/compliant_force_link_ori@_here_
  - terms/applied_force_tracking@_here_
  - terms/applied_torque_tracking@_here_
  - terms/tracking_compliant_joint_pos@_here_

_target_: gear_sonic.envs.manager_env.mdp.rewards.RewardsCfg

tracking_anchor_pos:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_anchor_pos_error
  params:
    std: 0.1
tracking_anchor_ori:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_anchor_ori_error
  params:
    std: 0.15
tracking_relative_body_pos:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_relative_body_pos_error
  params:
    std: 0.1
tracking_relative_body_ori:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_relative_body_ori_error
  params:
    std: 0.15
tracking_vr_5point_local:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_local_vr_5point_error
  params:
    std: 0.06
tracking_body_linvel:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_body_linvel_error
tracking_body_angvel:
  func: gear_sonic.envs.manager_env.mdp:tracking_compliant_body_angvel_error
feet_acc:
  weight: -2.5e-06

# ── force_link 的 σ 必须跟着数据的柔顺幅度走（2026-09-19）───────────────────
# σ=0.1 m 是 SoftMimic 的值，匹配的是**他们**的腕部位移量级。我们 d25 时腕部位移
# 中位 5.1 cm，σ=0.1 恰好（e/σ=0.51，接近最优梯度点 0.707）。
# 换到 d1545（退让区间 U[0.15,0.45]）后腕部位移中位变成 **18.1 cm**，e/σ=1.81
# 已进饱和区，起点梯度只剩最优的 16% —— 增益看着有 96% 却学不动。
# 取 σ=0.20：e/σ=0.91，起点梯度为最优的 93%。
# 这是"改了数据忘了改 σ"的又一次实例，已加进 scripts/preflight_check.py 自动拦截。
#
# B2 后在当前 full 数据上的中位 e/σ：relative_body_pos 0.878、anchor_pos 0.472、
# vr_5point 1.782。前两者在有效带 [0.2,1.5]；VR 已部分越过上界，新配方建议
# σ 0.06 -> 0.10。位置项 σ=0.20 合适；朝向项复用 0.20 缺少独立依据，建议 0.40。
compliant_force_link_pos:
  params:
    std: 0.20
compliant_force_link_ori:
  params:
    std: 0.20
