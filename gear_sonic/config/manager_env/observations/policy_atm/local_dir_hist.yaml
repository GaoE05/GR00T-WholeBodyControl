# 喂给**冻结 ATM** 的观测组 —— 是 policy/local_dir_hist.yaml 的逐字副本，
# 只把 _target_ 换成 PolicyAtmCfg。
#
# 存在的意义：ATM 的输入维度被 checkpoint 锁死在 930，而我们要往策略侧加观测。
# 有了这个组，manager_env_wrapper._prepare_obs_for_action_transform_module 会用它
# 替换 ATM 的 actor_obs，policy 组便可自由扩展而不动 ATM。
#
# **本文件必须与 policy/local_dir_hist.yaml 的项、顺序、history、噪声逐字一致**，
# 任何偏差都会让 ATM 静默吃错输入（不报错、行为全错）。改动前请先跑
# scripts/verify_policy_atm.py 做逐位比对。

defaults:
  - ../terms/gravity_dir@_here_
  - ../terms/base_ang_vel@_here_
  - ../terms/joint_pos@_here_
  - ../terms/joint_vel@_here_
  - ../terms/actions@_here_

_target_: gear_sonic.envs.manager_env.mdp.observations.PolicyAtmCfg
enable_corruption: True
concatenate_terms: True


# define noise for certain terms
gravity_dir:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.05
    n_max: 0.05

base_ang_vel:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.2
    n_max: 0.2

joint_pos:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.01
    n_max: 0.01

joint_vel:
  history_length: ${actor_prop_history_length}
  noise:
    _target_: isaaclab.utils.noise.AdditiveUniformNoiseCfg
    n_min: -0.5
    n_max: 0.5

actions:
  history_length: ${actor_actions_history_length}
